<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página GitHub</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #fff;
      font-size: 3rem;
      text-shadow: 2px 2px #00000050;
    }
    p {
      font-size: 1.2rem;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #ff6f61;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #ff3b2e;
    }
  </style>
</head>
<body>
  <h1>¡Bienvenido a mi página! 🌐</h1>
  <p>Esta es mi primera web en GitHub Pages.</p>
  <button onclick="alert('¡Hola desde tu web!')">Haz clic aquí</button>
</body>
</html>
